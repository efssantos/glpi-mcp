services:
  glpi-mcp:
    build: .
    image: glpi-mcp:local
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PROXY_MODE: "true"
      MCP_AUTH_ENABLED: "true"
      MCP_PUBLIC_URL: https://${MCP_DOMAIN}/mcp
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # TCP probe: confirms the listener is accepting connections, not full MCP readiness.
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - egress

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - glpi-mcp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
    driver: bridge
  egress:
    driver: bridge
